# GENERATED by gateway/gen_nginx.py from routes.json. Do not edit by hand.
worker_processes auto;
events { worker_connections 1024; }
http {
    log_format svc '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'service=$upstream_http_x_fincept_service rt=$request_time';
    access_log /dev/stdout svc;
    error_log /dev/stderr warn;
    # Docker DNS, re-resolved at request time so the gateway starts and keeps
    # serving when one service is down (that service alone returns 503).
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 64m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    default_type application/json;
    server {
        listen 80;
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_down;
        location @service_down {
            add_header X-Fincept-Service-Down $fincept_svc always;
            return 503 '{"error":"service unavailable","service":"$fincept_svc"}';
        }
        location = /healthz { return 200 '{"ok":true,"service":"gateway"}'; }
        location = /routes.json { alias /etc/nginx/routes.json; }
        location ~ ^/v1/scripts/aisstream_data\.py$ {
            add_header X-Fincept-Unrouted 1 always;
            return 404 '{"error":"script runs in the desktop app"}';
        }
        location ~ ^/v1/scripts/baostock_data\.py$ {
            add_header X-Fincept-Unrouted 1 always;
            return 404 '{"error":"script runs in the desktop app"}';
        }
        location ~ ^/v1/scripts/databento_[A-Za-z0-9_]+\.py$ {
            add_header X-Fincept-Unrouted 1 always;
            return 404 '{"error":"script runs in the desktop app"}';
        }
        location ~ ^/v1/scripts/prediction_(kalshi|polymarket)\.py$ {
            add_header X-Fincept-Unrouted 1 always;
            return 404 '{"error":"script runs in the desktop app"}';
        }
        location ~ ^/v1/scripts/spreadsheet\.py$ {
            add_header X-Fincept-Unrouted 1 always;
            return 404 '{"error":"script runs in the desktop app"}';
        }
        # market-data: Quotes, history, search, company info (Yahoo Finance) with a warm worker pool
        location ~ ^/v1/scripts/(?:(?:yfinance_data\.py)|(?:screener_data\.py)|(?:fetch_peers\.py)|(?:fetch_company_news\.py)|(?:cboe_[A-Za-z0-9_]*\.py))$ {
            set $fincept_svc market-data;
            set $fincept_up http://market-data:8000;
            proxy_pass $fincept_up;
        }
        location ~ ^/v1/yfinance/[a-z_]+$ {
            set $fincept_svc market-data;
            set $fincept_up http://market-data:8000;
            proxy_pass $fincept_up;
        }
        location = /services/market-data/healthz {
            set $fincept_svc market-data;
            set $fincept_up http://market-data:8000;
            proxy_pass $fincept_up/healthz;
        }
        # analytics: Quant, corporate finance, M&A, portfolio and technical analytics; notebook code cells
        location ~ ^/v1/scripts/(?:(?:Analytics/[A-Za-z0-9_/]+\.py)|(?:notebook_cell_runner\.py))$ {
            set $fincept_svc analytics;
            set $fincept_up http://analytics:8000;
            proxy_pass $fincept_up;
        }
        location = /v1/code {
            set $fincept_svc analytics;
            set $fincept_up http://analytics:8000;
            proxy_pass $fincept_up;
        }
        location = /services/analytics/healthz {
            set $fincept_svc analytics;
            set $fincept_up http://analytics:8000;
            proxy_pass $fincept_up/healthz;
        }
        # connectors: Economics, government, central-bank and other data connectors
        location ~ ^/v1/scripts/(?:(?:[A-Za-z0-9_]+\.py))$ {
            set $fincept_svc connectors;
            set $fincept_up http://connectors:8000;
            proxy_pass $fincept_up;
        }
        location = /services/connectors/healthz {
            set $fincept_svc connectors;
            set $fincept_up http://connectors:8000;
            proxy_pass $fincept_up/healthz;
        }
        location /v1/scripts/ {
            add_header X-Fincept-Unrouted 1 always;
            return 404 '{"error":"no service owns this script"}';
        }
    }
}
